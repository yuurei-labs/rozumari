[project]
name = "firmware"
version = "0.0.0"
requires-python = ">=3.10"


[dependency-groups]
dev = ["micropython-rp2-rpi-pico2-w-stubs>=1.28.0", "mpremote>=1.29.0"]


[tool.ruff]
ignore = ["BLE001", "E722", "S110"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingModuleSource = "none"
typeshedPath = "./.venv/lib/python3.10/site-packages"
